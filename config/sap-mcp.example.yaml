# Example only. Never place credentials or client secrets here.
#
## Runtime configuration must be supplied through the local MCP client/provider.\n# The gateway is disabled by default; enable it explicitly in the local environment.\n# AGENTESAP_MCP_ENABLED=true\n# AGENTESAP_MCP_COMMAND=sap-devs\n# AGENTESAP_MCP_ARGS="mcp serve"\n# AGENTESAP_MCP_MAX_RESULTS=5

providers:
  sap_devs:
    enabled: true
    transport: stdio
    command: sap-devs
    args:
      - mcp
      - serve
    allowed_tools:
      - list_packs
      - get_context
      - search_resources
      - get_known_errors
      - get_samples
      - search_tutorials
      - search_learning_journeys
    read_only: true

  sap_mcp_server:
    enabled: false
    transport: stdio
    command: sap-mcp-server
    args: []
    # Runtime credentials belong in the provider's local connections.json.
    allowed_tools: []
    read_only: true

  abap_ai:
    enabled: false
    transport: streamable_http
    url: "https://example.invalid/mcp"
    allowed_tools: []
    read_only: true
