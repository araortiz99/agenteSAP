[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-sap"
version = "0.1.0"
description = "SAP functional knowledge and analysis agent"
requires-python = ">=3.12,<3.14"

[project.scripts]
agentesap = "src.agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
