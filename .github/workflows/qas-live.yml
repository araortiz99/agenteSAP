name: QAS Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qas-live:
    runs-on: ubuntu-latest
    environment: qas
    env:
      AGENTESAP_QAS_LIVE_TESTS: "true"
      AGENTESAP_SAP_RUNTIME_ENABLED: "true"
      AGENTESAP_SAP_RUNTIME_LANDSCAPE: QAS
      AGENTESAP_SAP_RUNTIME_SCOPE: mcp_readonly
      AGENTESAP_SAP_RUNTIME_SYSTEM: ${{ vars.AGENTESAP_SAP_RUNTIME_SYSTEM }}
      AGENTESAP_SAP_RUNTIME_READ_TOOLS: ${{ vars.AGENTESAP_SAP_RUNTIME_READ_TOOLS }}
      AGENTESAP_SAP_RUNTIME_QUERY_TOOL: ${{ vars.AGENTESAP_SAP_RUNTIME_QUERY_TOOL }}
      AGENTESAP_SAP_RUNTIME_QUERY_ARGUMENT: ${{ vars.AGENTESAP_SAP_RUNTIME_QUERY_ARGUMENT }}
      AGENTESAP_QAS_LIVE_QUERY: ${{ vars.AGENTESAP_QAS_LIVE_QUERY }}
      AGENTESAP_SAP_MCP_COMMAND: /usr/local/bin/sap-mcp-server
      AGENTESAP_SAP_MCP_ARGS: ""
      AGENTESAP_SAP_MCP_CONNECTIONS_JSON: ${{ secrets.AGENTESAP_SAP_MCP_CONNECTIONS_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install official SAP MCP server
        run: |
          curl -fsSL https://github.com/sap-support/sap-mcp-server/releases/latest/download/install-sap-mcp.sh | bash
          test -x /usr/local/bin/sap-mcp-server
          /usr/local/bin/sap-mcp-server --version || true

      - name: Materialize QAS MCP connection config
        shell: bash
        env:
          CONNECTIONS_JSON: ${{ secrets.AGENTESAP_SAP_MCP_CONNECTIONS_JSON }}
        run: |
          test -n "$CONNECTIONS_JSON" || {
            echo "Missing qas environment secret: AGENTESAP_SAP_MCP_CONNECTIONS_JSON" >&2
            exit 1
          }
          install -d -m 700 "$RUNNER_TEMP/sap-mcp"
          printf '%s' "$CONNECTIONS_JSON" > "$RUNNER_TEMP/sap-mcp/connections.json"
          chmod 600 "$RUNNER_TEMP/sap-mcp/connections.json"
          echo "SAP_MCP_CONFIG=$RUNNER_TEMP/sap-mcp/connections.json" >> "$GITHUB_ENV"

      - name: Verify configured QAS MCP catalog
        run: |
          python - <<'PY'
          import asyncio
          import os
          from src.sap.mcp_client import SapMcpClient
          from src.sap.mcp_registry import build_target

          async def main():
              target = build_target(
                  "sap_mcp_server",
                  command=os.environ["AGENTESAP_SAP_MCP_COMMAND"],
                  args=(),
                  allowed_tools=(),
                  metadata={"landscape": "QAS", "discovery_only": True},
              )
              async with SapMcpClient(target) as client:
                  print(f"server={client.server_info().name} version={client.server_info().version}")
                  for d in await client.list_tool_descriptors():
                      print(
                          f"{d.name}	read_only={d.read_only_hint}"
                          f"	destructive={d.destructive_hint}"
                      )

          asyncio.run(main())
          PY

      - name: Run real QAS read-only smoke test
        run: python -m pytest -q tests/test_qas_live_smoke.py
