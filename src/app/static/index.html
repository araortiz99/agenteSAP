<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgenteSAP Workbench</title>
<style>
:root{font-family:system-ui,sans-serif;color:#20232a;background:#eef1f5}
*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:#171a21;color:#fff;padding:18px}.brand{font-size:20px;font-weight:700;margin-bottom:20px}
aside button{width:100%;text-align:left;background:#252a34;color:#fff;border:0;padding:10px;border-radius:8px;margin-bottom:8px;cursor:pointer}
main{max-width:1100px;width:100%;padding:24px;margin:auto}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 16px #0001;margin-bottom:16px}
textarea,input{width:100%;padding:11px;border:1px solid #ccd1d9;border-radius:9px;font:inherit}
textarea{min-height:130px;resize:vertical}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
button.primary{background:#252a34;color:#fff;border:0;border-radius:9px;padding:11px 18px;cursor:pointer}
button.secondary{background:#edf0f4;border:0;border-radius:9px;padding:11px 18px;cursor:pointer}
#answer{white-space:pre-wrap;line-height:1.5}.meta{font-size:13px;color:#667085}
.history button{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
pre{white-space:pre-wrap;background:#f6f7f9;padding:12px;border-radius:9px;overflow:auto}
details{margin-top:12px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#edf0f4;font-size:12px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{display:none}.row{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="brand">AgenteSAP</div>
<div class="meta" style="color:#aab1bd;margin-bottom:16px">Workbench personal · read-only</div>
<button onclick="newConsult()">＋ Nueva consulta</button>
<button onclick="ticketWorkspace()">🎫 Analizar ticket</button>
<div class="history" id="history"></div>
</aside>
<main>
<div class="card">
<h2 id="title">Consultor SAP</h2>
<div class="meta">La interfaz usa el agente existente; no contiene lógica SAP propia.</div>
<label>Ticket / incidente (opcional)</label>
<input id="ticket" placeholder="Ej.: 31426" inputmode="numeric">
<br><br>
<textarea id="request" placeholder="Ej.: Analizá el ticket 31426 y separá hechos confirmados, implementación, gaps y próximos pasos."></textarea>
<div class="row">
<button class="primary" onclick="consult()">Consultar al agente</button>
<button class="secondary" onclick="newConsult()">Limpiar</button>
</div>
</div>
<div class="card">
<h3>Respuesta</h3>
<div id="answer">Esperando consulta…</div>
<div id="ticketPanels" style="display:none">
  <details open><summary>Hechos / implementación</summary><pre id="confirmed">—</pre></details>
  <details><summary>Gaps / próximos pasos</summary><pre id="gaps">—</pre></details>
  <details><summary>Evidencias</summary><pre id="evidence">—</pre></details>
</div>
<details><summary>Plan y trazabilidad</summary><pre id="trace">—</pre></details>
</div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const KEY="agentesap.history.v1";
let history=JSON.parse(localStorage.getItem(KEY)||"[]");

function renderHistory(){
  $("history").innerHTML="";
  history.slice(0,12).forEach((item,i)=>{
    const b=document.createElement("button");
    b.textContent=item.request;
    b.onclick=()=>loadHistory(i);
    $("history").appendChild(b);
  });
}
function save(item){
  history=[item,...history.filter(x=>x.request!==item.request)].slice(0,12);
  localStorage.setItem(KEY,JSON.stringify(history));renderHistory();
}
function loadHistory(i){
  const x=history[i];$("request").value=x.request;$("ticket").value=x.ticket_id||"";
  $("answer").textContent=x.answer||"";
  $("trace").textContent=JSON.stringify(x.trace||{},null,2);
}
function newConsult(){
  $("request").value="";$("ticket").value="";$("answer").textContent="Esperando consulta…";$("trace").textContent="—";$("request").focus();
}
function ticketWorkspace(){
  const ticket=$("ticket").value.trim();
  if(!ticket){$("answer").textContent="Ingresá primero el ID del ticket.";return}
  $("request").value="Analizá el ticket "+ticket+" y estructurá el análisis separando: hechos confirmados, evidencia disponible, hipótesis, gaps de información, objetos SAP relacionados y próximos pasos.";
  consult();
}
async function consult(){
  const request=$("request").value.trim();
  if(!request){$("answer").textContent="Ingresá una consulta.";return}
  $("answer").textContent="Consultando…";
  try{
    const body={request};
    if($("ticket").value.trim()) body.ticket_id=$("ticket").value.trim();
    const r=await fetch("/api/consult",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"Error del agente");
    const result=data.result||data;
    $("answer").textContent=result.answer||JSON.stringify(result,null,2);
    const isTicket=Boolean(body.ticket_id||result.plan?.ticket_id);
    $("ticketPanels").style.display=isTicket?"block":"none";
    $("confirmed").textContent=result.answer||"—";
    $("gaps").textContent=(result.traceability?.gaps||[]).join("\n")||"No hay gaps estructurados disponibles.";
    $("evidence").textContent=(result.citations||[]).map(c=>c.citation_id+" → "+c.path+" ["+c.certainty+"]").join("\n")||"No hay citas.";
    $("trace").textContent=JSON.stringify({
      intent:result.plan?.intent,
      ticket_id:result.plan?.ticket_id,
      capabilities:result.plan?.capabilities,
      citations:result.citations,
      uncited_evidence_ids:result.uncited_evidence_ids
    },null,2);
    save({request,ticket_id:body.ticket_id||"",answer:result.answer||"",trace:{
      plan:result.plan,citations:result.citations,uncited_evidence_ids:result.uncited_evidence_ids
    }});
  }catch(e){$("answer").textContent="Error: "+e.message}
}
renderHistory();
</script>
</body>
</html>
