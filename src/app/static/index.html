<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgenteSAP</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:0 auto;padding:24px;background:#f6f7fb;color:#20232a}
main{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}
textarea{width:100%;min-height:120px;box-sizing:border-box;padding:12px;border:1px solid #ccd1d9;border-radius:10px}
button{margin-top:12px;padding:10px 18px;border:0;border-radius:9px;cursor:pointer}
pre{white-space:pre-wrap;background:#f1f3f5;padding:16px;border-radius:10px;min-height:120px}
.status{font-size:.9rem;margin-bottom:16px}
</style>
</head>
<body>
<main>
<h1>AgenteSAP</h1>
<div class="status">Consultor SAP · modo read-only · localhost</div>
<textarea id="request" placeholder="Ej.: Explicame qué es un goods movement en SAP MM"></textarea>
<br><button id="ask">Consultar</button>
<pre id="result">Esperando consulta…</pre>
</main>
<script>
const requestBox=document.getElementById("request");
const result=document.getElementById("result");
document.getElementById("ask").onclick=async()=>{
  const request=requestBox.value.trim();
  if(!request){result.textContent="Ingresá una consulta.";return;}
  result.textContent="Consultando…";
  try{
    const r=await fetch("/api/consult",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({request})});
    const data=await r.json();
    result.textContent=data.result?.answer || data.answer || JSON.stringify(data,null,2);
  }catch(e){result.textContent="Error: "+e.message;}
};
</script>
</body>
</html>
